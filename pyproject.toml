[project]
name = "excephalon"
version = "0.1.0"
description = "Excephalon — a local, voice-in/voice-out, memory-persistent Claude pairing partner."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",     # persistent Claude session on the Max plan (the brain)
    "onnx-asr[cpu,hub]>=0.11",   # local Parakeet speech-to-text
    # Local neural text-to-speech; the robot System.Speech voice remains the fallback while the
    # model downloads. 0.4.7 is the newest release that installs on Python 3.14 (0.5.x caps at
    # <3.14); on the gate's 3.13 pip may resolve newer, which the suite never exercises - tests
    # fake the engine, and nothing downloads the model.
    "kokoro-onnx>=0.4.7",
    "sounddevice>=0.4",          # microphone capture and the neural voice's playback
    "sherpa-onnx>=1.13",         # speaker embeddings: learning his voice, scoring what the mic hears
    "numpy>=1.26",               # audio frames + energy VAD
    "soundfile>=0.13",           # the Voice Log's MP3s: 0.13 is the first that can ask for constant bitrate
    "flask>=3",                  # the window is a local web app
    "pywebview>=5",              # ...shown in its own native window rather than a browser tab
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only tools/install-start-menu.ps1 needs this, to stamp the shortcut's AppUserModelID so a
# taskbar pin and the running window are one button. The app itself never imports it.
setup = ["pywin32>=306"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
